<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><style>
@page{size:A4;margin:14mm}body{margin:0;font-family:Arial,sans-serif;background:#f8fafc;color:#1f2937}header{border-bottom:3px solid #d24f74;padding-bottom:12px}h1{margin:0;font-size:25px}.meta{color:#64748b;font-size:11px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:18px}.card{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:16px}.card span{display:block;font-size:9px;text-transform:uppercase;color:#64748b}.card strong{display:block;font-size:26px;margin-top:5px}.footer{font-size:9px;color:#94a3b8;margin-top:18px}
</style></head><body><header><h1>{{.Title}}</h1><div class="meta">Generated {{.GeneratedAt}}</div></header>

<div class="footer">Confidential executive operations report · Chattie</div></body></html>
