<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><style>
@page{size:A4;margin:14mm}body{margin:0;font-family:Arial,sans-serif;background:#f8fafc;color:#1f2937}header{border-bottom:3px solid #d24f74;padding-bottom:12px}h1{margin:0;font-size:24px}.meta{color:#64748b;font-size:11px}.metrics{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:16px 0}.metric{background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:14px}.metric span{display:block;color:#64748b;font-size:9px;text-transform:uppercase}.metric strong{font-size:22px}table{width:100%;border-collapse:collapse;background:#fff}th{font-size:9px;text-align:left;text-transform:uppercase;background:#eef2f7;padding:8px}td{font-size:9px;padding:7px;border-bottom:1px solid #e5e7eb}.footer{font-size:9px;color:#94a3b8;margin-top:14px}
</style></head><body><header><h1>{{.Title}}</h1><div class="meta">Generated {{.GeneratedAt}}</div></header>
<section class="metrics"><div class="metric"><span>Open reports</span><strong>{{.OpenReports}}</strong></div><div class="metric"><span>Resolved / closed</span><strong>{{.ResolvedReports}}</strong></div></section>
<table><thead><tr><th>Date</th><th>Target</th><th>Reporter</th><th>Status</th><th>Reason</th></tr></thead><tbody>{{range .Recent}}<tr><td>{{.Date}}</td><td>{{.Target}}</td><td>{{.Reporter}}</td><td>{{.Status}}</td><td>{{.Reason}}</td></tr>{{else}}<tr><td colspan="5">No reports found</td></tr>{{end}}</tbody></table>
<div class="footer">Confidential moderation report · Chattie</div></body></html>
