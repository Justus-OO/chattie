<!DOCTYPE html>
<html>
<head>
    <style>
        body { font-family: 'Helvetica', sans-serif; background: #f8fafc; color: #1f2937; padding: 40px; }
        .box { border: 1px solid #e2e8f0; border-radius: 12px; padding: 20px; background: #fff; }
        h1 { color: #d24f74; text-transform: uppercase; letter-spacing: 2px; }
        .footer { color: #94a3b8; font-size: 10px; margin-top: 30px; }
    </style>
</head>
<body>
<h1>{{.Title}}</h1>
<div class="box">
    <p><strong>USER ID:</strong> {{.UserID}}</p>
    <p><strong>USERNAME:</strong> {{.Username}}</p>
    <p><strong>RISK SCORE:</strong> {{.RiskScore}}</p>
</div>
<p class="footer">Generated: {{.GeneratedAt}} · Confidential administrative report</p>
</body>
</html>
