<!DOCTYPE html>
<html>
<head>
    <style>
        body { font-family: 'Helvetica', sans-serif; background: #000; color: #fff; padding: 40px; }
        .box { border: 2px solid #333; padding: 20px; background: #111; }
        h1 { color: #facc15; text-transform: uppercase; letter-spacing: 2px; }
    </style>
</head>
<body>
<h1>{{.Title}}</h1>
<div class="box">
    <p><strong>USER ID:</strong> {{.UserID}}</p>
    <p><strong>USERNAME:</strong> {{.Username}}</p>
    <p><strong>RISK SCORE:</strong> {{.RiskScore}}</p>
</div>
<p style="color: #666; font-size: 10px; margin-top: 30px;">Generated: {{.GeneratedAt}}</p>
</body>
</html>
